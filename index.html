<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plages autour de moi</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
}

#map{
    width:100%;
    height:100%;
}

#btn{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    border:1px solid #999;
    border-radius:8px;
    padding:12px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>

<body>

<button id="btn">
📍 Chercher les plages autour de moi
</button>

<div id="map"></div>

<script>

const map = L.map("map").setView([35.68,139.76],6);

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

let gpsMarker=null;
let plages=[];
async function chercher(){

if(gpsMarker){
map.removeLayer(gpsMarker);
}

plages.forEach(function(p){
map.removeLayer(p);
});

plages=[];

navigator.geolocation.getCurrentPosition(
async function(position){

const lat=position.coords.latitude;
const lon=position.coords.longitude;

gpsMarker=L.marker([lat,lon]).addTo(map);
gpsMarker.bindPopup("Vous êtes ici").openPopup();

map.setView([lat,lon],14);

const requete=`
[out:json][timeout:25];
(
way["natural"="beach"](around:10000,${lat},${lon});
relation["natural"="beach"](around:10000,${lat},${lon});
);
out geom;
`;

const reponse=await fetch(
"https://overpass-api.de/api/interpreter",
{
method:"POST",
body:requete
}
);

const json=await reponse.json();
  json.elements.forEach(function(element){

if(!element.geometry) return;

const points=element.geometry.map(function(p){
return [p.lat,p.lon];
});

const plage=L.polygon(points,{
color:"orange",
weight:2,
fillOpacity:0.4
}).addTo(map);

plage.bindPopup(
element.tags?.name || "Plage"
);

plages.push(plage);

});

},
function(err){

alert(
"Impossible d'obtenir votre position.\n\n"
+ err.message
);

},
{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}
);

}

document
.getElementById("btn")
.addEventListener("click",chercher);
  </script>

</body>
</html>
